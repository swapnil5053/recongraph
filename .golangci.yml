version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      # TLS verification is skipped only behind an explicit --insecure flag.
      - path: internal/fetch/client\.go
        text: "TLS InsecureSkipVerify"

formatters:
  enable:
    - gofmt
