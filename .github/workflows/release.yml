name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name=recongraph-${VERSION}-${os}-${arch}
            bin=recongraph; [ "$os" = windows ] && bin=recongraph.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/swapnil5053/recongraph/internal/cli.Version=${VERSION}" \
              -o "build/$name/$bin" ./cmd/recongraph
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
